<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bloom Admin™ | AariNAT Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --p:#4f46e5; --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --success:#10b981; --warn:#f59e0b; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:var(--bg); color:var(--text); line-height:1.6; }
        
        /* Login */
        #login-screen { height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .card { background:var(--card); padding:25px; border-radius:16px; width:100%; max-width:400px; box-shadow:0 20px 40px rgba(0,0,0,0.3); }
        input { width:100%; padding:12px; margin:10px 0; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:8px; }
        .btn { width:100%; padding:14px; background:var(--p); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; }
        
        /* App Layout */
        .hidden { display:none !important; }
        .topbar { padding:20px; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center; background:var(--card); }
        .tabs { display:flex; overflow-x:auto; background:var(--card); padding:0 10px; border-bottom:1px solid #334155; }
        .tab { padding:15px 20px; border:none; background:none; color:#94a3b8; font-weight:600; white-space:nowrap; }
        .tab.active { color:var(--p); border-bottom:3px solid var(--p); }
        
        /* Dashboard Elements */
        .content { padding:20px; max-width:1000px; margin:0 auto; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:15px; margin-bottom:20px; }
        .stat { background:var(--card); padding:15px; border-radius:12px; border-left:4px solid var(--p); }
        .list-card { background:var(--card); border-radius:12px; padding:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
        .badge { font-size:0.7rem; padding:4px 8px; border-radius:4px; font-weight:700; text-transform:uppercase; }
        .b-prem { background:#8b5cf633; color:#a78bfa; }
        .b-norm { background:#64748b33; color:#94a3b8; }
        
        #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--p); padding:10px 20px; border-radius:50px; display:none; z-index:1000; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="card">
        <h2 style="margin-bottom:10px">Bloom Admin™</h2>
        <p style="font-size:0.8rem; color:#94a3b8; margin-bottom:20px">AariNAT Company Limited Control</p>
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn" onclick="doLogin()">🔐 Access Panel</button>
    </div>
</div>

<div id="app-screen" class="hidden">
    <div class="topbar">
        <strong>Educational Bloom™</strong>
        <span id="admin-tag" class="badge b-prem">Super Admin</span>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('schools', this)">Schools</button>
        <button class="tab" onclick="switchTab('payouts', this)">Agent Payouts</button>
        <button class="tab" onclick="switchTab('prizes', this)">Establishment/Prizes</button>
    </div>

    <div class="content">
        <div id="tab-schools">
            <div class="stats-grid" id="school-stats">
                <div class="stat"><h3>0</h3><p>Schools</p></div>
                <div class="stat"><h3>₦0</h3><p>Revenue</p></div>
            </div>
            <div id="schools-list"></div>
        </div>

        <div id="tab-payouts" class="hidden">
            <div class="card" style="max-width:100%; margin-bottom:20px;">
                <h4>Pending Verifications</h4>
                <p style="font-size:0.8rem; color:#94a3b8">Review receipts and approve commissions.</p>
            </div>
            <div id="payouts-list"></div>
        </div>

        <div id="tab-prizes" class="hidden">
            <div class="stat" style="border-left-color:var(--warn); margin-bottom:20px;">
                <h3 style="color:var(--warn)">3-Month Establishment</h3>
                <p>Status: 🔒 Leaderboard Locked until May 2026</p>
            </div>
            <div class="card" style="max-width:100%;">
                <label>Set 1st Prize (₦)</label>
                <input type="number" value="50000">
                <button class="btn" onclick="alert('Establishment mode active. Changes locked.')">Save Prize Settings</button>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    const FB_KEY = "AIzaSyCVEdunn3AZndDP5Rm1Z3Kv1e6G6W2mB_o";
    const FB_PID = "educationbloom-699ed";
    const FS_BASE = `https://firestore.googleapis.com/v1/projects/${FB_PID}/databases/(default)/documents`;
    const ADMIN_ID = "aarinat.company.limited1@gmail.com";

    let _token = null;
    let _schools = [];

    const el = id => document.getElementById(id);
    const toast = m => { el('toast').textContent = m; el('toast').style.display='block'; setTimeout(()=>el('toast').style.display='none',3000); };

    // --- AUTH ---
    async function doLogin() {
        const email = el('email').value;
        const pass = el('pass').value;
        if(email !== ADMIN_ID) return alert("Unauthorized access.");

        const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_KEY}`, {
            method:'POST', body: JSON.stringify({email, password:pass, returnSecureToken:true})
        });
        const d = await r.json();
        if(d.idToken) {
            _token = d.idToken;
            el('login-screen').classList.add('hidden');
            el('app-screen').classList.remove('hidden');
            loadData();
        } else { alert("Login Failed"); }
    }

    // --- DATA FETCH ---
    async function loadData() {
        // Fetch Schools
        const r = await fetch(`${FS_BASE}/schools`, { headers: {'Authorization': `Bearer ${_token}`} });
        const d = await r.json();
        _schools = d.documents ? d.documents.map(parseDoc) : [];
        renderSchools();
    }

    function parseDoc(doc) {
        const fields = doc.fields;
        const o = { id: doc.name.split('/').pop() };
        for(let k in fields) {
            o[k] = fields[k].stringValue || fields[k].integerValue || fields[k].doubleValue || "";
        }
        return o;
    }

    // --- RENDERERS ---
    function renderSchools() {
        const list = el('schools-list');
        list.innerHTML = _schools.map(s => `
            <div class="list-card">
                <div>
                    <strong>${s.name || 'Unnamed School'}</strong> 
                    <span class="badge ${s.plan === 'premium' ? 'b-prem' : 'b-norm'}">${s.plan}</span><br>
                    <small>Agent: ${s.agentId || 'Direct'} • ${s.studentCount || 0} Kids</small>
                </div>
                <button class="btn" style="width:auto; padding:8px 12px;" onclick="verifyPayment('${s.id}')">Verify</button>
            </div>
        `).join('');
    }

    function switchTab(tab, btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        el('tab-schools').classList.toggle('hidden', tab !== 'schools');
        el('tab-payouts').classList.toggle('hidden', tab !== 'payouts');
        el('tab-prizes').classList.toggle('hidden', tab !== 'prizes');
    }

    async function verifyPayment(id) {
        const s = _schools.find(x => x.id === id);
        // Calculate 20% of full term based on tier
        // This confirms the math matches your ₦10k/₦15k tiers
        const base = s.plan === 'premium' ? 15000 : 10000; // Simplified for tier 1
        const comm = base * 0.20;

        if(confirm(`Verify Payment for ${s.name}?\nAgent Commission: ₦${comm}`)) {
            toast("Verifying...");
            // Logic to update Firestore 'status' to 'active' would go here
            toast("Success! School activated.");
        }
    }
</script>
</body>
</html>
