<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edu-Bloom™ | AariNAT</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <div id="loading-overlay" class="overlay hidden"><div class="spinner"></div></div>

    <div id="login-screen">
        <div class="card" style="max-width: 400px; width: 90%; margin: 50px auto; text-align: center;">
            <h1 style="color: var(--primary); margin-bottom: 5px;">Edu-Bloom™</h1>
            <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 25px;">AariNAT Company Limited</p>
            <input type="email" id="login-email" placeholder="School Email">
            <input type="password" id="login-pass" placeholder="Password">
            <button class="btn-primary" onclick="doLogin()">🔐 Sign In</button>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <header class="app-header">
            <button onclick="ui.sidebar()" style="background:none; border:none; font-size: 1.5rem;">☰</button>
            <strong style="color: var(--primary);">Edu-Bloom™</strong>
            <div id="plan-badge" class="badge">NORMAL</div>
        </header>
        <nav id="main-sidebar" class="sidebar">
            <button class="nav-item active" onclick="nav('dash')">📊 Dashboard</button>
            <button class="nav-item" onclick="nav('students')">👥 Students</button>
            <button class="nav-item" onclick="nav('comm')">🛡️ Comm Hub</button>
            <button class="nav-item" onclick="nav('pay')">💳 Subscription</button>
            <button class="nav-item" onclick="location.reload()" style="color:var(--danger); margin-top:30px;">Logout</button>
        </nav>
        <main id="main-content" class="content"></main>
    </div>

    <div id="toast"></div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
        }
    </script>
</body>
</html>
