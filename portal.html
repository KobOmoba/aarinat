<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AariNAT School Portal · Revenue Recovery</title>
  <style>
    :root {
      --brand: #4f46e5; --money: #10b981; --danger: #ef4444; --danger-light: #fef2f2;
      --surface: #ffffff; --bg: #f1f5f9; --text: #0f172a; --sub: #64748b; --border: #e2e8f0;
      --radius: 16px; --shadow: 0 4px 12px rgba(0,0,0,0.04);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
    .header {
      background: var(--text); color: white; padding: 1.2rem 1.25rem;
      border-bottom: 4px solid var(--brand); display: flex; justify-content: space-between; align-items: center;
    }
    .header h1 { font-size: 1.3rem; font-weight: 800; }
    .nav-tabs { display: flex; gap: 1rem; font-size: 0.9rem; }
    .nav-tabs span { opacity: 0.7; cursor: pointer; padding-bottom: 2px; border-bottom: 2px solid transparent; }
    .nav-tabs span.active { opacity: 1; border-bottom-color: var(--money); }
    .container { padding: 1rem; max-width: 600px; margin: 0 auto; }
    .card {
      background: var(--surface); border-radius: var(--radius); padding: 1.25rem;
      margin-bottom: 1rem; box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    h3 { font-size: 1rem; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
    label { font-size: 0.7rem; font-weight: 700; color: var(--sub); text-transform: uppercase; display: block; margin-bottom: 0.25rem; }
    input, select {
      width: 100%; padding: 0.7rem; margin-bottom: 0.8rem; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 0.95rem; background: #fafbfc;
    }
    button {
      display: block; width: 100%; padding: 0.85rem; border: none; border-radius: 12px;
      font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 0.5rem; transition: 0.2s;
    }
    .btn-brand { background: var(--brand); color: white; }
    .btn-money { background: var(--money); color: white; }
    .btn-outline { background: transparent; border: 1.5px solid var(--brand); color: var(--brand); }
    .btn-danger { background: var(--danger); color: white; }

    .leakage-box { background: var(--danger-light); border: 1.5px dashed var(--danger); border-radius: 12px; padding: 1rem; text-align: center; margin-bottom: 1rem; }
    .leakage-amt { font-size: 1.7rem; font-weight: 900; color: var(--danger); }

    .summary-bar {
      display: flex; justify-content: space-between; background: var(--surface); border-radius: 12px;
      padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .summary-item { text-align: center; flex: 1; }
    .summary-number { font-size: 1.3rem; font-weight: 800; }
    .summary-label { font-size: 0.7rem; color: var(--sub); text-transform: uppercase; }

    .chart-container { margin-bottom: 1rem; background: var(--surface); border-radius: 12px; padding: 1rem; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .progress-bar-bg { background: #e2e8f0; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 0.3rem; }
    .progress-bar-fill { height: 100%; background: var(--money); border-radius: 10px; transition: width 0.5s; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 0.7rem; font-weight: 700; color: white; }

    .student-row {
      display: flex; justify-content: space-between; align-items: center; padding: 0.8rem;
      background: var(--surface); border-radius: 10px; margin-bottom: 0.5rem;
      border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .student-info { flex: 2; }
    .student-name { font-weight: 700; font-size: 0.95rem; }
    .student-detail { font-size: 0.75rem; color: var(--sub); }
    .status-badge { font-size: 0.7rem; padding: 0.25rem 0.6rem; border-radius: 20px; font-weight: 700; }
    .status-paid { background: #dcfce7; color: #166534; }
    .status-owing { background: #fef2f2; color: #991b1b; }

    .actions { display: flex; gap: 0.4rem; }
    .action-btn {
      font-size: 0.75rem; padding: 0.4rem 0.6rem; border-radius: 8px; border: none;
      cursor: pointer; font-weight: 600;
    }

    .modal {
      display: none; position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999;
    }
    .modal-card { background: white; border-radius: 16px; padding: 1.5rem; width: 90%; max-width: 400px; }
  </style>
</head>
<body>

<div class="header">
  <h1>AariNAT Portal</h1>
  <div class="nav-tabs">
    <span id="tabDashboard" class="active" onclick="switchTab('dashboard')">💰 Dashboard</span>
    <span id="tabSetup" onclick="switchTab('setup')">⚙️ Setup</span>
  </div>
</div>

<div class="container">
  <!-- SETUP VIEW -->
  <div id="setupView" style="display:none;">
    <div class="card">
      <h3>⚙️ School Setup</h3>
      <label>Average Termly Fee (₦)</label>
      <input type="number" id="setupFee" placeholder="e.g. 50000">
      <label>Upload Student Register (CSV)</label>
      <input type="file" id="csvUpload" accept=".csv" onchange="handleSetupCSV(event)" style="display:none">
      <button class="btn-outline" onclick="document.getElementById('csvUpload').click()">📁 Upload CSV</button>
      <div id="csvFeedbackSetup" style="font-size:0.8rem; margin:0.5rem 0; color:var(--sub);"></div>
      <label>Or Add Students Manually</label>
      <input type="text" id="manualName" placeholder="Student Name">
      <input type="tel" id="manualPhone" placeholder="Parent WhatsApp (234...)">
      <button class="btn-outline" onclick="addManualStudent()">➕ Add Student</button>
      <div style="margin-top:1rem; font-weight:700; font-size:0.9rem;">Current Students: <span id="setupCount">0</span></div>
      <button class="btn-brand" onclick="saveSetup()">✅ Save & Start Recovering</button>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboardView">
    <!-- Summary Cards -->
    <div class="summary-bar">
      <div class="summary-item"><div class="summary-number" style="color:var(--text);" id="totalStudents">0</div><div class="summary-label">Students</div></div>
      <div class="summary-item"><div class="summary-number" style="color:var(--brand);" id="totalExpected">₦0</div><div class="summary-label">Expected</div></div>
      <div class="summary-item"><div class="summary-number" style="color:var(--money);" id="totalCollected">₦0</div><div class="summary-label">Collected</div></div>
      <div class="summary-item"><div class="summary-number" style="color:var(--danger);" id="totalOutstanding">₦0</div><div class="summary-label">Outstanding</div></div>
    </div>

    <!-- Collection Progress Chart -->
    <div class="chart-container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.3rem;">
        <span style="font-weight:700; font-size:0.9rem;">📊 Collection Progress</span>
        <span id="progressPercent" style="font-weight:800; color:var(--money);">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%;">0%</div>
      </div>
    </div>

    <!-- Bulk Payment Import -->
    <div class="card" style="padding:1rem;">
      <h3>📥 Bulk Payment Import (Bank Statement)</h3>
      <input type="file" id="bulkPaymentFile" accept=".csv" onchange="handleBulkPayment(event)" style="display:none">
      <button class="btn-outline" onclick="document.getElementById('bulkPaymentFile').click()">Upload Payment CSV</button>
      <div id="bulkFeedback" style="font-size:0.8rem; margin-top:0.5rem; color:var(--sub);"></div>
    </div>

    <!-- Leakage Snapshot (shown after setup) -->
    <div class="card" id="leakageCard" style="display:none;">
      <h3>📊 Your Leakage Snapshot</h3>
      <div class="leakage-box">
        <div style="font-size:0.7rem; font-weight:700; color:#991b1b;">EST. ANNUAL FEE LEAKAGE</div>
        <div class="leakage-amt" id="portalLeakage">₦0</div>
        <div style="font-size:0.8rem;">Recoverable: <strong id="portalRecovery">—</strong></div>
        <button class="btn-money" onclick="document.getElementById('leakageCard').style.display='none';">Start Recovery →</button>
      </div>
    </div>

    <!-- Student List -->
    <div id="studentList"></div>
    <div style="text-align:center; margin-top:0.5rem;">
      <button class="btn-outline" onclick="switchTab('setup')">➕ Add More Students</button>
    </div>
  </div>
</div>

<!-- Payment Modal -->
<div class="modal" id="paymentModal">
  <div class="modal-card">
    <h3>💵 Record Payment</h3>
    <input type="number" id="paymentAmount" placeholder="Amount (₦)">
    <button class="btn-money" onclick="recordPayment()">Confirm Payment</button>
    <button class="btn-outline" onclick="closeModal()" style="margin-top:0.5rem;">Cancel</button>
  </div>
</div>

<script>
  // ---------- DATA STORAGE ----------
  const STORAGE_KEY = 'aarinat_students';
  const FEE_KEY = 'aarinat_fee';

  function getStudents() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  }
  function saveStudents(students) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
  }
  function getFee() {
    return parseFloat(localStorage.getItem(FEE_KEY) || '0');
  }
  function saveFee(fee) {
    localStorage.setItem(FEE_KEY, fee.toString());
  }

  // ---------- UI SWITCHING ----------
  function switchTab(tab) {
    document.getElementById('tabDashboard').classList.remove('active');
    document.getElementById('tabSetup').classList.remove('active');
    if (tab === 'dashboard') {
      document.getElementById('dashboardView').style.display = 'block';
      document.getElementById('setupView').style.display = 'none';
      document.getElementById('tabDashboard').classList.add('active');
      renderDashboard();
    } else {
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('setupView').style.display = 'block';
      document.getElementById('tabSetup').classList.add('active');
      renderSetup();
    }
  }

  // ---------- SETUP LOGIC ----------
  function renderSetup() {
    const students = getStudents();
    document.getElementById('setupCount').textContent = students.length;
    const fee = getFee();
    if (fee > 0) document.getElementById('setupFee').value = fee;
  }

  function handleSetupCSV(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
      if (lines.length < 2) return alert('CSV must have header and data rows.');
      const students = getStudents();
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.trim());
        if (cols.length >= 2 && cols[0] && cols[1]) {
          students.push({
            name: cols[0],
            phone: cols[1].replace(/\D/g, ''),
            totalFee: getFee() || 50000,
            paid: 0
          });
        }
      }
      saveStudents(students);
      document.getElementById('csvFeedbackSetup').textContent = `✅ Added ${lines.length-1} students.`;
      renderSetup();
    };
    reader.readAsText(file);
  }

  function addManualStudent() {
    const name = document.getElementById('manualName').value.trim();
    const phone = document.getElementById('manualPhone').value.trim();
    if (!name || !phone) return alert('Enter name and phone.');
    const students = getStudents();
    students.push({
      name: name,
      phone: phone.replace(/\D/g, ''),
      totalFee: getFee() || 50000,
      paid: 0
    });
    saveStudents(students);
    document.getElementById('manualName').value = '';
    document.getElementById('manualPhone').value = '';
    renderSetup();
  }

  function saveSetup() {
    const fee = parseFloat(document.getElementById('setupFee').value);
    if (!fee || fee <= 0) return alert('Set a valid termly fee.');
    saveFee(fee);
    const students = getStudents().map(s => ({ ...s, totalFee: fee }));
    saveStudents(students);
    alert('Setup saved!');
    switchTab('dashboard');
    calculateLeakage();
  }

  // ---------- LEAKAGE CALCULATION ----------
  function calculateLeakage() {
    const students = getStudents();
    const fee = getFee();
    if (students.length === 0 || fee === 0) return;
    const annualPotential = students.length * fee * 3;
    const loss = annualPotential * 0.15;
    document.getElementById('portalLeakage').textContent = '₦' + Math.round(loss).toLocaleString();
    document.getElementById('portalRecovery').textContent = `₦${Math.round(loss*0.7).toLocaleString()} – ₦${Math.round(loss*0.9).toLocaleString()}`;
    document.getElementById('leakageCard').style.display = 'block';
  }

  // ---------- DASHBOARD RENDERING ----------
  function renderDashboard() {
    const students = getStudents();
    const fee = getFee();
    if (students.length === 0) {
      document.getElementById('studentList').innerHTML = '<p style="text-align:center; color:var(--sub);">No students yet. <a href="#" onclick="switchTab(\'setup\')">Add students</a>.</p>';
      updateSummary(0,0,0);
      updateChart(0,0);
      return;
    }

    let totalExpected = 0, totalCollected = 0;
    const listHtml = students.map((s, idx) => {
      const expected = s.totalFee;
      const collected = s.paid || 0;
      totalExpected += expected;
      totalCollected += collected;
      const outstanding = Math.max(expected - collected, 0);
      const statusClass = outstanding === 0 ? 'status-paid' : 'status-owing';
      const statusText = outstanding === 0 ? 'Paid' : 'Owing';

      return `
        <div class="student-row">
          <div class="student-info">
            <div class="student-name">${escapeHtml(s.name)}</div>
            <div class="student-detail">📱 ${s.phone} | Fee: ₦${expected.toLocaleString()} | Paid: ₦${collected.toLocaleString()}</div>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
          <div class="actions">
            ${outstanding > 0 ? `
              <button class="action-btn" style="background:var(--money); color:white;" onclick="sendReminder(${idx})">📲 Remind</button>
              <button class="action-btn" style="background:var(--brand); color:white;" onclick="openPaymentModal(${idx})">💰 Pay</button>
            ` : `<span style="font-size:0.8rem; color:var(--money);">✓</span>`}
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('studentList').innerHTML = listHtml;
    const totalOutstanding = totalExpected - totalCollected;
    updateSummary(students.length, totalExpected, totalCollected, totalOutstanding);
    updateChart(totalCollected, totalExpected);
  }

  function updateSummary(count, expected, collected, outstanding) {
    document.getElementById('totalStudents').textContent = count;
    document.getElementById('totalExpected').textContent = '₦' + expected.toLocaleString();
    document.getElementById('totalCollected').textContent = '₦' + collected.toLocaleString();
    document.getElementById('totalOutstanding').textContent = '₦' + (outstanding || 0).toLocaleString();
  }

  function updateChart(collected, expected) {
    const percent = expected > 0 ? Math.round((collected / expected) * 100) : 0;
    document.getElementById('progressPercent').textContent = percent + '%';
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressFill').textContent = percent > 5 ? percent + '%' : '';
  }

  // ---------- BULK PAYMENT CSV IMPORT ----------
  function handleBulkPayment(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
      if (lines.length < 2) return alert('Payment CSV must have header and data rows.');
      const students = getStudents();
      let matchCount = 0, noMatchCount = 0;
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.trim());
        if (cols.length >= 2 && cols[0] && cols[1]) {
          const payerName = cols[0].toLowerCase();
          const amount = parseFloat(cols[1]);
          if (isNaN(amount) || amount <= 0) continue;
          // Try to match by student name (case‑insensitive)
          const matching = students.filter(s => s.name.toLowerCase().includes(payerName) || payerName.includes(s.name.toLowerCase()));
          if (matching.length === 1) {
            matching[0].paid = (matching[0].paid || 0) + amount;
            matchCount++;
          } else if (matching.length > 1) {
            // ambiguous – skip to avoid mistakes
            noMatchCount++;
          } else {
            noMatchCount++;
          }
        }
      }
      saveStudents(students);
      document.getElementById('bulkFeedback').textContent = `✅ Matched ${matchCount} payment(s). ⚠️ ${noMatchCount} unmatched.`;
      renderDashboard();
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- ACTIONS ----------
  function sendReminder(index) {
    const students = getStudents();
    const s = students[index];
    const outstanding = s.totalFee - (s.paid || 0);
    const msg = `Dear Parent,%0A%0AThis is a reminder that *${s.name}* has an outstanding school fee balance of *₦${outstanding.toLocaleString()}*.%0A%0APlease make payment at your earliest convenience.%0A%0AThank you.%0A– School Management`;
    window.open(`https://wa.me/${s.phone}?text=${msg}`, '_blank');
  }

  let paymentIndex = null;
  function openPaymentModal(index) {
    paymentIndex = index;
    document.getElementById('paymentAmount').value = '';
    document.getElementById('paymentModal').style.display = 'flex';
  }

  function recordPayment() {
    const amount = parseFloat(document.getElementById('paymentAmount').value);
    if (!amount || amount <= 0) return alert('Enter a valid amount.');
    const students = getStudents();
    const s = students[paymentIndex];
    s.paid = (s.paid || 0) + amount;
    saveStudents(students);
    closeModal();
    renderDashboard();
  }

  function closeModal() {
    document.getElementById('paymentModal').style.display = 'none';
    paymentIndex = null;
  }

  // ---------- INIT ----------
  window.addEventListener('DOMContentLoaded', () => {
    const students = getStudents();
    if (students.length === 0) {
      switchTab('setup');
    } else {
      switchTab('dashboard');
      calculateLeakage();
    }
  });
</script>
</body>
  </html>
