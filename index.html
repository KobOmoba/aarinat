<script>
const FB_KEY = "AIzaSyCVEdunn3AZndDP5Rm1Z3Kv1e6G6W2mB_o";
const FB_PID = "educationbloom-699ed";
const FS = `https://firestore.googleapis.com/v1/projects/${FB_PID}/databases/(default)/documents`;
let _token=null,_uid=null,schoolId=null,currentUser=null,demoMode=false,agentId=null;
let cache={students:[],teachers:[],health:[],alumni:[],expenses:[],payments:[]};
const PRICING=[{min:1,max:50,price:20000},{min:51,max:100,price:35000},{min:101,max:200,price:55000},{min:201,max:9999,price:75000}];
function getPriceTier(n){return PRICING.find(p=>n>=p.min&&n<=p.max)||PRICING[PRICING.length-1];}
const el=x=>document.getElementById(x);
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function openModal(id){el(id).classList.add('on');}
function closeModal(id){el(id).classList.remove('on');}
function toFs(o){const f={};for(const[k,v]of Object.entries(o)){if(v===null)f[k]={nullValue:null};else if(typeof v==='boolean')f[k]={booleanValue:v};else if(typeof v==='number')f[k]=Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};else f[k]={stringValue:String(v)};}return{fields:f};}
function fromFs(f){if(!f)return{};const o={};for(const[k,v]of Object.entries(f)){if('stringValue'in v)o[k]=v.stringValue;else if('integerValue'in v)o[k]=parseInt(v.integerValue);else if('doubleValue'in v)o[k]=v.doubleValue;else if('booleanValue'in v)o[k]=v.booleanValue;}return o;}
async function fsGet(p){try{const r=await fetch(`${FS}/${p}`,{headers:{'Authorization':'Bearer '+_token}});if(r.status===404)return null;const d=await r.json();if(d.error)return null;return{exists:true,data:()=>fromFs(d.fields)};}catch(e){return null;}}
async function fsSet(p,o){try{const r=await fetch(`${FS}/${p}`,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_token},body:JSON.stringify(toFs(o))});return r.ok;}catch(e){return false;}}
async function fsAdd(c,o){try{const r=await fetch(`${FS}/${c}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_token},body:JSON.stringify(toFs(o))});const d=await r.json();return d.name?d.name.split('/').pop():null;}catch(e){return null;}}
async function fsList(c){try{const r=await fetch(`${FS}/${c}?pageSize=500`,{headers:{'Authorization':'Bearer '+_token}});if(!r.ok)return[];const d=await r.json();return d.documents?d.documents.map(x=>({id:x.name.split('/').pop(),...fromFs(x.fields)})):[];}catch(e){return[];}}
async function fsUpdate(p,o){try{const mask=Object.keys(o).map(k=>`updateMask.fieldPaths=${k}`).join('&');const r=await fetch(`${FS}/${p}?${mask}`,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_token},body:JSON.stringify(toFs(o))});return r.ok;}catch(e){return false;}}

// ── AGENT DASHBOARD FUNCTIONS ──
async function showAgentDashboard() {
    document.getElementById('login-screen').style.display='none';
    document.getElementById('agent-dashboard').style.display='block';
    agentId = new URLSearchParams(window.location.search).get('ref') || 'agent';
    await loadAgentStats();
    await loadMySchools();
    await loadLeaderboard('monthly');
}

async function loadAgentStats() {
    if (!agentId) return;
    const commissions = await fsList(`agents/${agentId}/commissions`);
    let total = 0, pending = 0, schools = [];
    commissions.forEach(c => {
        total += c.amount || 0;
        if (!c.paid) pending += c.amount || 0;
        if (c.schoolId && !schools.includes(c.schoolId)) schools.push(c.schoolId);
    });
    document.getElementById('agt-sch').textContent = schools.length;
    document.getElementById('agt-earn').textContent = '₦' + total.toLocaleString();
    document.getElementById('agt-pend').textContent = '₦' + pending.toLocaleString();
}

async function loadMySchools() {
    if (!agentId) return;
    const commissions = await fsList(`agents/${agentId}/commissions`);
    const schoolIds = [...new Set(commissions.map(c => c.schoolId))];
    const schoolsHtml = [];
    for (const sid of schoolIds) {
        const sch = await fsGet(`schools/${sid}`);
        schoolsHtml.push(`
            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                <span>${sch ? sch.data().name || 'Unnamed' : sid}</span>
                <span style="color:#64748b">${sch && sch.data().plan === 'active' ? '✅ Active' : '⏳ Pending'}</span>
            </div>
        `);
    }
    document.getElementById('agent-schools-list').innerHTML = schoolsHtml.join('') || '<div class="empty">No schools yet</div>';
}

async function loadLeaderboard(period) {
    const now = new Date();
    let startDate;
    if (period === 'monthly') startDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
    else if (period === 'termly') startDate = new Date(now.getFullYear(), now.getMonth() - 3, 1).toISOString();
    else if (period === 'yearly') startDate = new Date(now.getFullYear(), 0, 1).toISOString();

    // Fetch prize settings (admin-configured)
    const prizeDoc = await fsGet('prizeSettings/global');
    const prizes = prizeDoc ? prizeDoc.data() : { monthly: [50000, 30000, 20000], termly: [100000, 60000, 40000], yearly: [500000, 300000, 200000], locked: true };

    const agentDocs = await fsList('agents');
    const leaderboard = [];
    for (const agentDoc of agentDocs) {
        const agentIdLocal = agentDoc.id;
        const commissions = await fsList(`agents/${agentIdLocal}/commissions`);
        let periodTotal = 0;
        commissions.forEach(c => {
            if (c.createdAt && c.createdAt >= startDate) periodTotal += c.amount || 0;
        });
        leaderboard.push({ name: agentDoc.name || agentIdLocal, total: periodTotal });
    }
    leaderboard.sort((a, b) => b.total - a.total);
    const top10 = leaderboard.slice(0, 10);
    const prizeArray = prizes[period] || [0, 0, 0];
    const prizeBanner = prizes.locked
        ? '<div class="prize-banner" style="background:#ef4444; color:#fff">🔒 Prizes Locked</div>'
        : `<div class="prize-banner">🏆 Prizes Active: 1st ₦${prizeArray[0].toLocaleString()}, 2nd ₦${prizeArray[1].toLocaleString()}, 3rd ₦${prizeArray[2].toLocaleString()}</div>`;

    const table = `
        ${prizeBanner}
        <table class="leaderboard-table">
            <thead><tr><th>Rank</th><th>Agent</th><th>Earnings</th></tr></thead>
            <tbody>
                ${top10.map((a, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${a.name}</td>
                        <td>₦${a.total.toLocaleString()}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
        ${top10.length ? '' : '<div class="empty">No data for this period</div>'}
    `;
    document.getElementById('leaderboard-body').innerHTML = table;
}

</script>
